<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Line chart: share of UFC bouts with a heavy favourite (75% or better). 10.8% in 2021, 16.9% in 2022, 19.4% in 2023, 21.6% in 2024, 24.8% in 2025, and 28.2% in 2026 so far, through 19 September. The 2027 call is above 30%." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="720" height="360" fill="#000"/><text x="70" y="26" fill="#fff" font-size="16" font-weight="700">Lopsided matchups: share of UFC bouts with a heavy favourite, by year</text><line x1="70" x2="680" y1="300.0" y2="300.0" stroke="#fff" stroke-opacity=".12"/><text x="62" y="304.0" fill="#a6a6a6" font-size="12" text-anchor="end">0%</text><line x1="70" x2="680" y1="231.4" y2="231.4" stroke="#fff" stroke-opacity=".12"/><text x="62" y="235.4" fill="#a6a6a6" font-size="12" text-anchor="end">10%</text><line x1="70" x2="680" y1="162.9" y2="162.9" stroke="#fff" stroke-opacity=".12"/><text x="62" y="166.9" fill="#a6a6a6" font-size="12" text-anchor="end">20%</text><line x1="70" x2="680" y1="94.3" y2="94.3" stroke="#fff" stroke-opacity=".12"/><text x="62" y="98.3" fill="#a6a6a6" font-size="12" text-anchor="end">30%</text><line x1="70" x2="680" y1="94.3" y2="94.3" stroke="#fff" stroke-opacity=".55" stroke-dasharray="4 4"/><rect x="634" y="54" width="52" height="246" fill="#fff" fill-opacity=".06"/><text x="660" y="84.3" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Call: above 30%</text><text x="660" y="322" fill="#fff" font-size="12" text-anchor="middle">2027</text><polyline fill="none" stroke="#fff" stroke-width="2.5" points="90.0,225.9 185.0,184.1 280.0,167.0 375.0,151.9 470.0,129.9"/><line x1="470" y1="129.94285714285712" x2="565" y2="106.62857142857143" stroke="#fff" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="90" cy="225.9" r="4" fill="#fff"/><text x="90" y="213.9" fill="#fff" font-size="12" text-anchor="middle">10.8%</text><text x="90" y="322" fill="#a6a6a6" font-size="12" text-an