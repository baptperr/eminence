<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Line chart: share of UFC bouts ending in a KO, TKO or submission, January to mid-September of each year. 52.5% in 2016, 49.0% in 2021, 45.0% in 2024, 49.3% in 2025, 55.6% in 2026." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="720" height="360" fill="#000"/><text x="70" y="26" fill="#fff" font-size="16" font-weight="700">Bouts ending in a finish, by year</text><line x1="70" x2="680" y1="300.0" y2="300.0" stroke="#fff" stroke-opacity=".12"/><text x="62" y="304.0" fill="#a6a6a6" font-size="12" text-anchor="end">40%</text><line x1="70" x2="680" y1="180.0" y2="180.0" stroke="#fff" stroke-opacity=".12"/><text x="62" y="184.0" fill="#a6a6a6" font-size="12" text-anchor="end">50%</text><line x1="70" x2="680" y1="60.0" y2="60.0" stroke="#fff" stroke-opacity=".12"/><text x="62" y="64.0" fill="#a6a6a6" font-size="12" text-anchor="end">60%</text><polyline fill="none" stroke="#fff" stroke-width="2.5" points="90.0,150.0 147.0,165.6 204.0,195.6 261.0,223.2 318.0,186.0 375.0,192.0 432.0,153.6 489.0,171.6 546.0,240.0 603.0,188.4 660.0,112.8"/><circle cx="90" cy="150.0" r="4" fill="#fff"/><text x="90" y="138.0" fill="#fff" font-size="12" text-anchor="middle">52.5%</text><text x="90" y="322" fill="#a6a6a6" font-size="12" text-anchor="middle">2016</text><circle cx="147" cy="165.6" r="4" fill="#fff"/><text x="147" y="153.6" fill="#fff" font-size="12" text-anchor="middle">51.2%</text><text x="147" y="322" fill="#a6a6a6" font-size="12" text-anchor="middle">2017</text><circle cx="204" cy="195.6" r="4" fill="#fff"/><text x="204" y="183.6" fill="#fff" font-size="12" text-anchor="middle">48.7%</text><text x="204" y="322" fill="#a6a6a6" font-size="12" text-anchor="middle">2018</text><circle cx="261" cy="223.2" r="4" fill="#fff"/><text x="261" y="211.2" fill="#fff" font-size="12" text-anchor="middle">46.4%</text><text x="261" y="322" fill="#a6a6a6" font-size="12" text-anchor="middle">2019</text><circle cx="318" cy="186.0" r="4" fill="#fff"/><text x="318" y="174.0" fill="#fff" font-size="12" text-anchor="middle">49.5%</text><text x="318" y="322" fill="#a6a6a6" font-size="12" text-anchor="middle">2020</text><circle cx="375" cy="192.0" r="4" fill="#fff"/><text x="375" y="180.0" fill="#fff" font-size="12" text-anchor="middle">49.0%</text><text x="375" y="322" fill="#a6a6a6" font-size="12" text-anchor="middle">2021</text><circle cx="432" cy="153.6" r="4" fill="#fff"/><text x="432" y="141.6" fill="#fff" font-size="12" text-anchor="middle">52.2%</text><text x="432" y="322" fill="#a6a6a6" font-size="12" text-anchor="middle">2022</text><circle cx="489" cy="171.6" r="4" fill="#fff"/><text x="489" y="159.6" fill="#fff" font-size="12" text-anchor="middle">50.7%</text><text x="489" y="322" fill="#a6a6a6" font-size="12" text-anchor="middle">2023</text><circle cx="546" cy="240.0" r="4" fill="#fff"/><text x="556" y="260.0" fill="#fff" font-size="12" text-anchor="start">45.0%</text><text x="546" y="322" fill="#a6a6a6" font-size="12" text-anchor="middle">2024</text><circle cx="603" cy="188.4" r="4" fill="#fff"/><text x="613" y="208.4" fill="#fff" font-size="12" text-anchor="start">49.3%</text><text x="603" y="322" fill="#a6a6a6" font-size="12" text-anchor="middle">2025</text><circle cx="660" cy="112.8" r="4" fill="#fff"/><text x="660" y="100.8" fill="#fff" font-size="12" text-anchor="middle">55.6%</text><text x="660" y="322" fill="#a6a6a6" font-size="12" text-anchor="middle">2026</text><text x="70" y="350" fill="#a6a6a6" font-size="11">Jan to 19 Sep of each year, same window every year. KO, TKO and submission. Source: First Light Observatory.</text></svg>