<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Fit — FIRST LIGHT</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Red+Hat+Display:wght@800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { min-height: 100svh; display: flex; flex-direction: column; }

        .quiz-wrap {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 7rem 2rem 4rem; min-height: 100svh;
        }

        /* Intro */
        .quiz-intro { width: 100%; max-width: 580px; margin-bottom: 3rem; }
        .quiz-title {
            font-family: 'Red Hat Display', sans-serif;
            font-size: clamp(1.9rem, 4.2vw, 2.75rem);
            font-weight: 800; line-height: 1.15;
            letter-spacing: 0.01em;
            margin-bottom: 0.85rem;
        }
        .quiz-sub { font-size: 1rem; color: var(--t2); line-height: 1.6; }

        /* Progress */
        .quiz-progress {
            width: 100%; max-width: 580px;
            margin-bottom: 3.5rem;
            display: flex; align-items: center; gap: 1rem;
        }
        .progress-bar {
            flex: 1; height: 1px; background: var(--border-n);
            position: relative; overflow: hidden;
        }
        .progress-fill {
            position: absolute; left: 0; top: 0; bottom: 0;
            width: 100%; background: var(--amber);
            transform-origin: left;
            transform: scaleX(0);
            transition: transform 0.5s var(--ease);
        }
        .progress-label {
            font-size: 0.65rem; font-weight: 500; letter-spacing: 0.18em;
            text-transform: uppercase; color: var(--t3); white-space: nowrap;
        }

        /* Question */
        .quiz-q {
            width: 100%; max-width: 580px;
            animation: fadeUp 0.5s var(--ease) both;
        }
        .quiz-q.exit {
            animation: fadeDown 0.3s var(--ease) both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: none; }
        }
        @keyframes fadeDown {
            from { opacity: 1; transform: none; }
            to   { opacity: 0; transform: translateY(-12px); }
        }

        .q-text {
            font-family: 'Red Hat Display', sans-serif;
            font-size: clamp(1.6rem, 3.5vw, 2.4rem);
            font-weight: 800; line-height: 1.2;
            letter-spacing: 0.01em;
            margin-bottom: 2.5rem; text-wrap: balance;
        }

        .quiz-back {
            font-size: 0.65rem; font-weight: 500; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--t3);
            background: none; border: none; cursor: pointer;
            padding: 0; margin-bottom: 1.5rem; display: block;
            font-family: 'DM Sans', sans-serif;
            transition: color 0.2s;
        }
        .quiz-back:hover { color: var(--bone); }

        .answers { display: flex; flex-direction: column; gap: 0.75rem; }
        .answer {
            border: 1px solid var(--border-d);
            padding: 1.1rem 1.5rem;
            cursor: pointer; text-align: left;
            background: transparent;
            color: var(--t2); font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem; font-weight: 300; line-height: 1.5;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
            width: 100%;
        }
        .answer:hover {
            border-color: var(--amber);
            color: var(--bone);
            background: oklch(65% 0.12 55 / 0.06);
        }
        .answer.selected {
            border-color: var(--amber);
            background: oklch(65% 0.12 55 / 0.1);
            color: var(--bone);
        }

        /* Results */
        .quiz-result {
            width: 100%; max-width: 580px;
            animation: fadeUp 0.6s var(--ease) 0.1s both;
        }
        .result-kicker {
            font-size: 0.65rem; font-weight: 500; letter-spacing: 0.22em;
            text-transform: uppercase; color: var(--amber);
            display: block; margin-bottom: 1.5rem;
        }
        .result-vid {
            width: 100%; aspect-ratio: 20/9; overflow: hidden;
            background: var(--night-surface);
            margin-bottom: 1.75rem;
        }
        .result-vid .offer-vid-fallback { font-size: clamp(2rem, 6vw, 3.5rem); }
        .result-para {
            font-size: 0.98rem; color: var(--t2); line-height: 1.9;
            max-width: 52ch; margin-bottom: 2.75rem;
        }
        .result-actions { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
        .result-retry {
            font-size: 0.65rem; font-weight: 500; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--t3);
            background: none; border: none; cursor: pointer;
            text-decoration: underline; text-underline-offset: 3px;
            transition: color 0.2s; font-family: 'DM Sans', sans-serif;
        }
        .result-retry:hover { color: var(--bone); }

        .quiz-hidden { display: none; }
    </style>
</head>
<body>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
    <div class="drawer-head">
        <a href="index.html" class="drawer-logo"><img src="logo.svg" alt="FIRST LIGHT" class="drawer-logo-img"></a>
        <button class="drawer-close" id="drawerClose" aria-label="Close menu">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
    </div>
    <nav class="drawer-nav">
        <a href="index.html#hero" class="drawer-link drawer-link-quiz">Home</a>
        <a href="index.html#wwd" class="drawer-link drawer-link-quiz">What We Do</a>
        <a href="index.html#beliefs" class="drawer-link drawer-link-quiz">What We Believe</a>
        <div class="drawer-offers-group">
            <a href="index.html#offers" class="drawer-link drawer-link-quiz drawer-link-offers">Services</a>
            <div class="drawer-tier-list">
                <a href="promotion.html" class="drawer-link drawer-tier-link" data-page="promotion.html">
                    <span class="drawer-tier-name">Promotion</span>
                    <span class="drawer-tier-desc">We steer; you execute</span>
                </a>
                <a href="production.html" class="drawer-link drawer-tier-link" data-page="production.html">
                    <span class="drawer-tier-name">Production</span>
                    <span class="drawer-tier-desc">Full promotion, executed</span>
                </a>
                <a href="quiz.html" class="drawer-link drawer-link-findfit" data-page="quiz.html">Find Your Fit<span class="drawer-pill">Quiz</span></a>
            </div>
        </div>
        <a href="commercial.html" class="drawer-link drawer-link-quiz drawer-link-commercial" data-page="commercial.html">FIRST LIGHT Commercial</a>
    </nav>
</aside>

<nav class="nav">
    <a href="index.html" class="nav-logo" id="navLogo" aria-haspopup="true" aria-expanded="false"><img src="logo.svg" alt="FIRST LIGHT" class="nav-logo-img"></a>
</nav>

<main class="quiz-wrap">
    <!-- Intro -->
    <div class="quiz-intro">
        <h1 class="quiz-title">Find your fit.</h1>
        <p class="quiz-sub" id="quizSub">Five questions. Two minutes. A clear recommendation and why.</p>
    </div>

    <!-- Progress bar -->
    <div class="quiz-progress" id="quizProgress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="transform:scaleX(0)"></div></div>
        <span class="progress-label" id="progressLabel">1 of 5</span>
    </div>

    <!-- Question container -->
    <div id="quizQuestion" class="quiz-q"></div>

    <!-- Result container -->
    <div id="quizResult" class="quiz-result quiz-hidden"></div>
</main>

<footer>
    <a href="index.html" class="foot-logo"><img src="logo.svg" alt="FIRST LIGHT" class="foot-logo-img"></a>
    <nav class="foot-links">
        <a href="promotion.html" class="foot-link">Promotion</a>
        <a href="production.html" class="foot-link">Production</a>
        <a href="commercial.html" class="foot-link">Commercial</a>
    </nav>
    <p class="foot-copy">© 2026 FIRST LIGHT</p>
</footer>

<script src="nav.js"></script>
<script>
(function () {
    const questions = [
        {
            text: "When's your next fight?",
            answers: [
                { text: "Nothing booked yet — I'm between camps, waiting on the call", scores: { promotion: 3 } },
                { text: "Booked, and it's a normal one — a card I've fought before, another step along the way", scores: { promotion: 3 } },
                { text: "Booked, and it's the biggest of my career — main card, title shot, or a name people already argue about", scores: { production: 3 } },
                { text: "Booked, and there's real beef attached — people are already talking about this one", scores: { production: 3 } }
            ]
        },
        {
            text: "Who's actually filming your camp right now?",
            answers: [
                { text: "Nobody. The odd clip off my own phone when I think of it", scores: { promotion: 3 } },
                { text: "Me, when I remember — most of what's worth seeing never gets shot", scores: { promotion: 3 } },
                { text: "A mate with a camera, on and off, when he's free", scores: { production: 2 } },
                { text: "I want a crew there properly — camp days, fight week, all of it", scores: { production: 3 } }
            ]
        },
        {
            text: "How much of the work do you actually want to be doing?",
            answers: [
                { text: "I'll do it. Give me the plan and I'll film it and post it myself", scores: { promotion: 3 } },
                { text: "I can do it, but I want someone telling me exactly what and when", scores: { promotion: 3 } },
                { text: "I'll do the talking — I'd rather not be the one editing and posting", scores: { production: 2 } },
                { text: "None of it. I want to train, fight, and have it handled", scores: { production: 3 } }
            ]
        },
        {
            text: "What does the money side look like for this camp?",
            answers: [
                { text: "Tight. Whatever I spend on this has to be small and predictable", scores: { promotion: 3 } },
                { text: "There's some room, but it has to be worth it and it has to be a known number", scores: { promotion: 3 } },
                { text: "The purse on this fight would absorb a real production spend without me feeling it", scores: { production: 3 } },
                { text: "There's a sponsor or a deal behind this one that could cover the production outright", scores: { production: 4 } }
            ]
        },
        {
            text: "A year from now, what would make this worth it?",
            answers: [
                { text: "A name and an income that finally match the level I'm already competing at", scores: { promotion: 3 } },
                { text: "Enough coming in that I can take this full-time, or go all-in on what I've started", scores: { promotion: 3 } },
                { text: "One camp filmed properly, so there's finally a body of work with my name on it", scores: { production: 2 } },
                { text: "Breaking out past my own sport entirely — the wider world knowing who I am", scores: { production: 3 } }
            ]
        }
    ];

    const paragraphs = {
        promotion: "Your level is ahead of your name — high level, still stuck on the undercard. FIRST LIGHT Promotion puts a promoter in your corner for the whole camp: your brand defined, direction daily, a narrative built around the fight, and the pace dropping between fights so it never becomes another thing you have to train for. We steer; you execute. <br><em>$297 a week of camp. Half after your purse lands.</em>",
        production: "This camp is worth filming properly, and there's no good reason for you to be the one holding the phone. FIRST LIGHT Production is full promotion, executed: a crew on the ground through camp and fight week, everything cut and published, the placements pitched and booked. You show up and fight. <br><em>Quoted per fight, typically $8,000\u201324,000. Limited capacity.</em>"
    };

    const tierLinks = { promotion: 'promotion.html', production: 'production.html' };
    const tierLabels = { promotion: 'Explore Promotion \u2192', production: 'Explore Production \u2192' };
    const tierVideos = { promotion: 'promotion-offer.mp4', production: 'production-offer.mp4' };

    let current = 0;
    let scores = { promotion: 0, production: 0 };
    let answerLog = [];

    const qContainer = document.getElementById('quizQuestion');
    const rContainer = document.getElementById('quizResult');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const quizProgress = document.getElementById('quizProgress');
    const quizSub = document.getElementById('quizSub');

    function setProgress(index) {
        const pct = (index / questions.length) * 100;
        progressFill.style.transform = 'scaleX(' + pct / 100 + ')';
        progressLabel.textContent = (index + 1) + ' of ' + questions.length;
    }

    function goBack() {
        if (current === 0) return;
        const lastIdx = answerLog.pop();
        const prevAnswer = questions[current - 1].answers[lastIdx];
        Object.entries(prevAnswer.scores).forEach(function (kv) { scores[kv[0]] -= kv[1]; });
        current--;
        renderQuestion(current);
    }

    function renderQuestion(index) {
        quizSub.style.display = index === 0 ? '' : 'none';
        setProgress(index);
        const q = questions[index];
        qContainer.innerHTML =
            (index > 0 ? '<button class="quiz-back" id="backBtn">← Back</button>' : '') +
            '<p class="q-text">' + q.text + '</p>' +
            '<div class="answers">' +
            q.answers.map(function (a, i) {
                return '<button class="answer" data-idx="' + i + '">' + a.text + '</button>';
            }).join('') +
            '</div>';
        qContainer.className = 'quiz-q';

        if (index > 0) {
            document.getElementById('backBtn').addEventListener('click', goBack);
        }

        qContainer.querySelectorAll('.answer').forEach(function (btn) {
            btn.addEventListener('click', function () {
                btn.classList.add('selected');
                const aIdx = parseInt(btn.dataset.idx);
                const chosen = q.answers[aIdx];
                Object.entries(chosen.scores).forEach(function (kv) { scores[kv[0]] += kv[1]; });
                answerLog.push(aIdx);

                setTimeout(function () {
                    qContainer.className = 'quiz-q exit';
                    setTimeout(function () {
                        current++;
                        if (current < questions.length) {
                            renderQuestion(current);
                        } else {
                            showResult();
                        }
                    }, 300);
                }, 280);
            });
        });
    }

    function getWinner() {
        // Fame level does NOT decide the offer — crew and logistics do. Promotion
        // builds a name at any level, so it is the default and every answer that
        // does not specifically call for a crew scores it.
        // Production is the expensive, done-for-you offer, so it only makes sense
        // when the fight carries it, the camp is worth filming, the fighter wants
        // it off his hands, AND the money absorbs it. Needs 11 of a possible 16 —
        // roughly three of those four signals. Anything less is a fighter who does
        // not need the production team yet, which is most of them: that's Promotion.
        return scores.production >= 11 ? 'production' : 'promotion';
    }

    function showResult() {
        quizSub.style.display = 'none';
        const winner = getWinner();
        const para = paragraphs[winner];
        const link = tierLinks[winner];
        const label = tierLabels[winner];
        const video = tierVideos[winner];
        const name = winner.charAt(0).toUpperCase() + winner.slice(1);

        quizProgress.style.display = 'none';
        qContainer.style.display = 'none';
        rContainer.classList.remove('quiz-hidden');
        rContainer.innerHTML =
            '<span class="result-kicker">Your recommended path</span>' +
            '<div class="result-vid offer-vid">' +
            '<span class="offer-vid-fallback">' + name + '</span>' +
            '<video autoplay muted loop playsinline src="' + video + '" onerror="this.style.display=\'none\'"></video>' +
            '</div>' +
            '<p class="result-para">' + para + '</p>' +
            '<div class="result-actions">' +
            '<a href="' + link + '" class="btn btn-amber">' + label + '</a>' +
            '<button class="result-retry" id="retryBtn">Start over</button>' +
            '</div>';

        document.getElementById('retryBtn').addEventListener('click', function () {
            scores = { promotion: 0, production: 0 };
            answerLog = [];
            current = 0;
            quizProgress.style.display = '';
            qContainer.style.display = '';
            rContainer.classList.add('quiz-hidden');
            renderQuestion(0);
        });
    }

    renderQuestion(0);
})();
</script>
</body>
</html>
